services:
  - type: web
    name: la-llave
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AC_PRESUPUESTO_SEG
        value: "420"
      - key: AC_CONCURRENCIA
        value: "2"
      - key: PUBLIC_URL
        value: https://la-llave.onrender.com
      # Secretos: Render los pide al crear el servicio; nunca van en el repo
      - key: MCP_RUTA
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
